<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Login - KUSE</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- ICON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <i class="fa-solid fa-graduation-cap icon"></i>

    <h1>KUSE EVENT<br>MANAGEMENT SYSTEM</h1>

    <p class="faculty">คณะวิทยาศาสตร์และวิศวกรรมศาสตร์</p>

    <div class="line"></div>

    <p>
      มหาวิทยาลัยเกษตรศาสตร์<br>
      วิทยาเขตเฉลิมพระเกียรติ จังหวัดสกลนคร
    </p>
  </div>

  <!-- RIGHT -->
  <div class="card">

    <img src="images/KUSE_Logo.png" class="logo">

    <h2>ยินดีต้อนรับเข้าสู่ระบบ<br>จัดการข่าวสารและกิจกรรม</h2>
    <p class="sub">โปรดระบุข้อมูลเพื่อเข้าสู่ระบบผู้ดูแล</p>

    <input type="text" placeholder="ชื่อผู้ใช้งาน">

    <div class="password-box">
      <input type="password" id="password" placeholder="รหัสผ่าน">
      <i class="fa-solid fa-eye-slash eye" id="togglePassword"></i>
    </div>

    <button class="login-btn" onclick="login()">เข้าสู่ระบบ</button>

    <p class="forgot">ลืมรหัสผ่านหรือไม่?</p>

  </div>

</div>

<!-- JS -->
<script src="login.js"></script>

</body>
</html>
